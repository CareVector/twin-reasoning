version: "3.9"

services:
  backend:
    mem_limit: 2G
    mem_reservation: 1G
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - dokploy-network
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data      # mount exported Kaggle data
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.1}
      - USE_LOCAL_LLM=${USE_LOCAL_LLM:-false}
      - DATASET_PATH=data/All_Beauty.jsonl
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - dokploy-network
    ports:
      - "8080:80"
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      
      # HTTP router (redirects to HTTPS via middleware)
      - "traefik.http.routers.frontend-http.rule=Host(`twinreasoning.cosmologictech.com.ng`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.service=frontend-svc"
      - "traefik.http.routers.frontend-http.middlewares=redirect-to-https@file"
      
      # HTTPS router (with TLS)
      - "traefik.http.routers.frontend-https.rule=Host(`twinreasoning.cosmologictech.com.ng`)"
      - "traefik.http.routers.frontend-https.entrypoints=websecure"
      - "traefik.http.routers.frontend-https.service=frontend-svc"
      - "traefik.http.routers.frontend-https.tls=true"
      - "traefik.http.routers.frontend-https.tls.certresolver=letsencrypt"
      
      # Service definition (port 80 inside container)
      - "traefik.http.services.frontend-svc.loadbalancer.server.port=80"
    
networks:
  dokploy-network:
    external: true
